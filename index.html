<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Quiz ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1a001a, #4b003b);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* ================= QUIZ ================= */

    .quiz-box {
      width: 100%;
      max-width: 500px;
      background: rgba(255,255,255,0.12);
      padding: 30px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255,105,180,0.4);
      position: relative;
      z-index: 10;
    }

    h1 {
      color: #ff9ed2;
    }

    #question {
      font-size: 21px;
      margin: 25px 0;
    }

    .option {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: none;
      border-radius: 15px;
      background: #ff69b4;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .option:hover {
      background: #ff1493;
      transform: scale(1.03);
    }

    #result {
      font-size: 22px;
      margin-top: 20px;
      color: #ffd1e8;
    }

    #nextBtn {
      display: none;
      margin: 20px auto 0;
      padding: 12px 25px;
      border: none;
      border-radius: 20px;
      background: #fff;
      color: #d60075;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }

    /* ================= GRAND WISH ================= */

    .grand-page {
      position: fixed;
      inset: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,105,180,0.35), transparent 25%),
        radial-gradient(circle at 80% 80%, rgba(255,20,147,0.3), transparent 25%),
        linear-gradient(135deg, #090009, #320025, #090009);

      display: flex;
      justify-content: center;
      align-items: center;
      overflow-y: auto;
      padding: 30px 15px;
      z-index: 100;
      animation: pageAppear 1.5s ease;
    }

    .wish-card {
      width: 100%;
      max-width: 650px;
      text-align: center;
      padding: 35px 25px;
      border-radius: 35px;

      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.25);

      box-shadow:
        0 0 30px rgba(255,20,147,0.4),
        0 0 80px rgba(255,20,147,0.2);

      backdrop-filter: blur(15px);

      animation: cardAppear 1.8s ease;
    }

    .top-stars {
      font-size: 25px;
      letter-spacing: 8px;
      animation: sparkle 2s infinite;
    }

    .birthday-title {
      margin: 18px 0 5px;

      font-size: clamp(35px, 8vw, 65px);
      font-weight: bold;

      background: linear-gradient(
        90deg,
        #ff69b4,
        #fff,
        #ff1493,
        #fff,
        #ff69b4
      );

      background-size: 300%;

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      animation: titleGlow 4s infinite;
    }

    .name {
      font-size: clamp(25px, 6vw, 40px);
      color: #ffd1e8;
      margin: 10px 0 20px;

      text-shadow:
        0 0 10px #ff69b4,
        0 0 25px #ff1493;

      animation: nameGlow 2s infinite alternate;
    }

    .cake {
      font-size: 95px;
      margin: 15px 0;
      animation: cakeBounce 1.8s infinite;
      filter: drop-shadow(0 0 20px #ff69b4);
    }

    .divider {
      width: 80%;
      height: 1px;
      margin: 20px auto;
      background: linear-gradient(
        90deg,
        transparent,
        #ff69b4,
        white,
        #ff69b4,
        transparent
      );
    }

    .main-message {
      font-size: 21px;
      line-height: 1.8;
      color: #fff;
    }

    .special-message {
      margin-top: 20px;
      padding: 20px;

      border-radius: 20px;

      background: rgba(255,105,180,0.12);

      border: 1px solid rgba(255,105,180,0.3);

      color: #ffd9ec;

      font-size: 18px;
      line-height: 1.8;
    }

    .love-text {
      margin-top: 25px;

      font-size: 28px;
      font-weight: bold;

      color: #ff8acb;

      text-shadow:
        0 0 10px #ff1493,
        0 0 25px #ff1493;

      animation: heartbeat 1.5s infinite;
    }

    .hearts {
      font-size: 32px;
      margin: 20px 0;
      letter-spacing: 8px;
      animation: heartbeat 1.5s infinite;
    }

    .score-box {
      display: inline-block;

      margin-top: 15px;
      padding: 10px 25px;

      border-radius: 30px;

      background: rgba(255,215,0,0.12);

      border: 1px solid rgba(255,215,0,0.4);

      color: #ffd700;

      font-size: 17px;
      font-weight: bold;
    }

    .bottom-text {
      margin-top: 25px;

      font-size: 16px;
      color: #ffc7e3;
    }

    /* ================= FLOATING HEARTS ================= */

    .floating-heart {
      position: fixed;
      bottom: -40px;
      font-size: 25px;
      pointer-events: none;
      animation: floatHeart 6s linear forwards;
      z-index: 101;
    }

    /* ================= CONFETTI ================= */

    .confetti {
      position: fixed;
      top: -30px;
      font-size: 25px;
      pointer-events: none;
      z-index: 102;

      animation: confettiFall 5s linear forwards;
    }

    /* ================= ANIMATIONS ================= */

    @keyframes pageAppear {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: scale(0.7) translateY(50px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes titleGlow {
      0% {
        background-position: 0%;
      }

      50% {
        background-position: 100%;
      }

      100% {
        background-position: 0%;
      }
    }

    @keyframes nameGlow {
      from {
        text-shadow:
          0 0 5px #ff69b4;
      }

      to {
        text-shadow:
          0 0 15px #ff1493,
          0 0 35px #ff1493;
      }
    }

    @keyframes cakeBounce {
      0%, 100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-18px) scale(1.05);
      }
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }
    }

    @keyframes sparkle {
      0%, 100% {
        opacity: 0.5;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes floatHeart {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* ================= MOBILE ================= */

    @media (max-width: 500px) {

      body {
        padding: 15px;
      }

      .quiz-box {
        padding: 25px 18px;
      }

      #question {
        font-size: 18px;
      }

      .grand-page {
        padding: 20px 10px;
      }

      .wish-card {
        padding: 28px 18px;
        border-radius: 28px;
      }

      .cake {
        font-size: 75px;
      }

      .main-message {
        font-size: 17px;
      }

      .special-message {
        font-size: 16px;
      }

      .love-text {
        font-size: 23px;
      }

      .hearts {
        font-size: 25px;
        letter-spacing: 3px;
      }
    }

  </style>
</head>

<body>

  <!-- ================= QUIZ ================= -->

  <div class="quiz-box" id="quizBox">

    <h1>💖 Birthday Quiz 💖</h1>

    <p id="question"></p>

    <div id="options"></div>

    <button id="nextBtn" onclick="nextQuestion()">
      Next 💕
    </button>

    <div id="result"></div>

  </div>


  <script>

    /* ================= QUESTIONS ================= */

    const questions = [

  {
    question: "If you were beside me right now, what would I want to do first? 🥰",
    options: [
      "Give You a Hug 🤗",
      "Talk to You 💕",
      "Just Look at You 👀❤️",
      "All of these 🥹"
    ],
    answer: "Give you a Hug 🤗 "
  },

  {
    question: "What happens when I see your name on my phone? 📱❤️",
    options: [
      "I Smile 😊",
      "I Get Excited 🥰",
      "I Open It Immediately 💕",
      "All of these ❤️"
    ],
    answer: "I Smile 😊"
  },

  {
    question: "If you say 'I miss you', what would I want to say? 🥺",
    options: [
      "I Miss You Too ❤️",
      "Me Too 🥹",
      "Come Here 🤗",
      "I Want to Hug You ❤️"
    ],
    answer: "I Miss You Too ❤️"
  },

  {
    question: "What is my favorite feeling in our relationship? 💕",
    options: [
      "Being Loved ❤️",
      "Being Understood 🥰",
      "Being Cared For 🤗",
      "Being Yours 💖"
    ],
    answer: "Being Cared For 🤗"
  },

  {
    question: "What little thing you do touches my heart the most? 🥹",
    options: [
      "Checking on Me 💕",
      "Calling Me 📞",
      "Remembering Little Things ❤️",
      "Your Care 🥰"
    ],
    answer: "Calling Me 📞"
  },

  {
    question: "If we could escape to a secret place together, where would I want to go? 🌙❤️",
    options: [
      "The Beach 🌊",
      "A Hill Station 🏔️",
      "A Long Drive 🚗",
      "Somewhere Only We Know 💕"
    ],
    answer: "Somewhere Only We Know 💕"
  },

  {
    question: "What does my heart feel when you hold my hand? 🤝❤️",
    options: [
      "Happy 😊",
      "Safe 🥰",
      "Special 💕",
      "Everything Together ❤️"
    ],
    answer: "Safe 🥰"
  },

  {
    question: "What are you to me, beyond just being my birthday boy? 🥺❤️",
    options: [
      "A Beautiful Memory 🌸",
      "My Favorite Person 💕",
      "My Happiness 🥰",
      "Someone Very Special to Me ❤️"
    ],
    answer: "My Happiness 🥰"
  },

  {
    question: "What would we need to create a perfect memory together? ✨",
    options: [
      "Just You and Me ❤️",
      "No Phones 📵",
      "Lots of Talking 💬",
      "All of these 🥰"
    ],
    answer: "Just You and Me ❤️"
  },

  {
    question: "What would I miss the most if you weren't in my life? 🥺",
    options: [
      "Your Calls 📞",
      "Your Messages 💌",
      "Your Presence ❤️",
      "Everything About You 💕"
    ],
    answer: "Everything About You 💕"
  },

  {
    question: "If you had to describe me in one word, what would I secretly want it to be? 😘",
    options: [
      "Cute 🥰",
      "Crazy 😜",
      "Loving ❤️",
      "Your Person 💕"
    ],
    answer: "Loving ❤️"
  },

  {
    question: "What is the most important part of our story to me? 📖❤️",
    options: [
      "Our First Meeting 🥰",
      "Our Memories 📸",
      "Our Love ❤️",
      "Our Journey Together 💕"
    ],
    answer: "Our Love ❤️"
  }

];


    let currentQuestion = 0;

    let score = 0;


    /* ================= LOAD QUESTION ================= */

    function loadQuestion() {

      const q = questions[currentQuestion];

      document.getElementById("question").innerText =
        q.question;


      const optionsDiv =
        document.getElementById("options");

      optionsDiv.innerHTML = "";


      q.options.forEach(function(option) {

        const button =
          document.createElement("button");

        button.className = "option";

        button.innerText = option;


        button.onclick = function() {

          checkAnswer(option, button);

        };


        optionsDiv.appendChild(button);

      });


      document.getElementById("nextBtn").style.display =
        "none";


      document.getElementById("result").innerText =
        "";

    }


    /* ================= CHECK ANSWER ================= */

    function checkAnswer(selected, button) {

      const correct =
        questions[currentQuestion].answer;


      const buttons =
        document.querySelectorAll(".option");


      buttons.forEach(function(btn) {

        btn.disabled = true;

      });


      if (selected === correct) {

        score++;

        button.style.background = "#28a745";

        document.getElementById("result").innerText =
          "Correct! ❤️🥰";

      }

      else {

        button.style.background = "#dc3545";

        document.getElementById("result").innerText =
          "Oops! The answer is " + correct + " 💕";

      }


      document.getElementById("nextBtn").style.display =
        "block";

    }


    /* ================= NEXT QUESTION ================= */

    function nextQuestion() {

      currentQuestion++;


      if (currentQuestion < questions.length) {

        loadQuestion();

      }

      else {

        showGrandWish();

      }

    }


    /* ================= GRAND WISH ================= */

    function showGrandWish() {

      document.body.innerHTML = `

        <div class="grand-page">

          <div class="wish-card">

            <div class="top-stars">
              ✨ ⭐ ✨ ⭐ ✨
            </div>


            <h1 class="birthday-title">
              HAPPY BIRTHDAY
            </h1>


            <div class="name">
              ❤️ My Love ❤️
            </div>


            <div class="cake">
              🎂
            </div>


            <div class="divider"></div>


            <p class="main-message">

              Today is not just another day... 💖<br>

              Today is the day a very special person
              came into my life. 🥰

            </p>


            <div class="special-message">

              💌 <b>My Birthday Wish For You</b> 💌

              <br><br>

              You are not just a special person in my life, 
              you are one of the most beautiful parts of it. 
              🥹❤️ Thank you for being there, for making me smile,
              and for giving me so many beautiful memories. 
              Every moment with you is precious to me, and I’m 
              truly lucky to have you in my life. 🫶🏻

              <br><br>

              On your special day, I just want to wish you 
              endless happiness, success, good health, and 
              everything your heart desires. ✨ May all your 
              dreams come true, and may I always be there 
              beside you through every smile, every struggle, 
              and every beautiful moment. ❤️

              <br><br>

              No matter how much I say, it will never be 
              enough to explain how much you mean to me. 
              You are my favourite person, my happiness, 
              and someone very close to my heart. 🥰
              Happy Birthday, my love! ❤️🎂🫂
              I love you today, tomorrow, and always. 💕♾️

            </div>


            <div class="hearts">
              ❤️ 💕 💗 💓 💞 ❤️
            </div>


            <div class="love-text">
              I LOVE YOU SO MUCH🫂❤️
            </div>


            <div class="score-box">

              🏆 Quiz Score:
              ${score}/${questions.length}

            </div>


            <p class="bottom-text">

              🎁 Once again, Happy Birthday 
              MY DEAR SOLUMATE 🎂

              <br><br>

              Stay happy. Stay smiling.
              Keep shining always. ✨❤️
              ummaaaaaaaaaaaa💋💋💋💋💋

            </p>


            <div style="
              font-size:32px;
              margin-top:20px;
            ">

              🎈 🎉 🎂 🎉 🎈

            </div>

          </div>

        </div>

      `;


      startCelebration();

    }


    /* ================= CELEBRATION ================= */

    function startCelebration() {

      const confettiEmojis = [

        "🎉",
        "🎊",
        "✨",
        "💖",
        "❤️",
        "💕",
        "🌸",
        "🎈",
        "⭐",
        "🥰"

      ];


      /* CONFETTI */

      for (let i = 0; i < 70; i++) {

        const item =
          document.createElement("div");

        item.className = "confetti";

        item.innerText =
          confettiEmojis[
            Math.floor(
              Math.random() *
              confettiEmojis.length
            )
          ];


        item.style.left =
          Math.random() * 100 + "vw";


        item.style.animationDelay =
          Math.random() * 4 + "s";


        item.style.fontSize =
          (15 + Math.random() * 20) + "px";


        document.body.appendChild(item);


        setTimeout(function() {

          item.remove();

        }, 9000);

      }


      /* FLOATING HEARTS */

      setInterval(function() {

        const heart =
          document.createElement("div");

        heart.className =
          "floating-heart";

        heart.innerText =
          ["❤️","💕","💗","💖","💓"]
          [
            Math.floor(
              Math.random() * 5
            )
          ];


        heart.style.left =
          Math.random() * 100 + "vw";


        heart.style.fontSize =
          (18 + Math.random() * 20) + "px";


        document.body.appendChild(heart);


        setTimeout(function() {

          heart.remove();

        }, 6000);


      }, 500);

    }


    /* ================= START ================= */

    loadQuestion();

  </script>

</body>
</html>
